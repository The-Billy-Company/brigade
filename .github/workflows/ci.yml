# What has to be true before a change lands.
#
# brigade forks processes and reads their exit codes, so the one thing worth
# proving on every push is that the fan-out itself is correct on every OS a
# consumer's `zig build test` might run on — not just the host this was
# written on.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A branch supersedes its old run; main keeps each commit's release evidence.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Compile-only first: when this fails, the test log below is noise, and
      # the failure is one line rather than a suite's worth of scrollback.
      - run: zig build check
      - run: zig build test

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check .

  # Fragment names/types/bodies parse, and towncrier's own draft render is
  # non-vacuous — proven on every PR rather than discovered at tag time, when
  # a malformed `changelog.d/` entry is far more expensive to fix.
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: The-Billy-Company/.github/actions/package-release@a404e12749981c1909c8f751d477159a7bf74aee # main
        with:
          command: changelog
          args: --root .

  # These files are the only thing here that nothing else type-checks. A
  # workflow with an expression in a place the context is not available does
  # not fail a job — it fails to schedule any job at all, and the run reports
  # "workflow file issue" with no log to read. So the linters run against them
  # too: actionlint for the schema and expression contexts, zizmor for the
  # security posture (unpinned actions, credential persistence, injection).
  actions:
    name: actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
      - run: uv run --no-project --exclude-newer P2D --with zizmor==1.30.1 zizmor --no-online-audits --strict-collection .
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12

  # `contract/brigade.zone` declares this package's import topology. The graph is
  # small enough today that the contract reads like a formality — which is the
  # reason to have it now rather than later, because every package that vendors
  # brigade in-tree is excused from describing it and defers to this job. A
  # dependency "governed upstream" is only governed if upstream checks.
  #
  # No Zig and no build: zoning reads the tree, not a build graph.
  topology:
    name: topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
      # The fix is in the code, or in a `variance ... because "..."` that says
      # what would retire it — never in widening the contract to match whatever
      # the imports happen to do today. `--complete` adds the claim no law can
      # make: every package here carries a contract, including the next one.
      - name: Import topology
        run: uv run --no-project --exclude-newer P2D --with zoning==1.4.0 zoning verify --complete

  # The one check `release.yml`'s preflight polls for on the exact tagged
  # commit (`release.toml`'s `[ci].required_check`). Everything above feeds
  # into it, so a red job blocks the tag rather than the publish workflow
  # discovering it minutes into the archive verification. `if: always()` is
  # required — the default `if` on a job would skip this one the moment
  # anything upstream failed, which is exactly the case it has to report on.
  release-ready:
    if: always()
    needs: [test, fmt, changelog, actions, topology]
    runs-on: ubuntu-latest
    steps:
      - name: every required job is green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 -c "
          import json, os
          needs = json.loads(os.environ['NEEDS'])
          failed = sorted(name for name, info in needs.items() if info['result'] != 'success')
          if failed:
              raise SystemExit(f'not release-ready: {failed} did not succeed')
          print(f'release-ready: {len(needs)} required jobs all succeeded')
          "
