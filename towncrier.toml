# Towncrier configuration for brigade.
#
# News fragments live in changelog.d/<slug>.<type>.md and are assembled into
# CHANGELOG.md at the `<!-- towncrier release notes start -->` marker:
#
#   towncrier build --version x.y.z
#
[tool.towncrier]
name = "brigade"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
# wrapper reflows each entry as a single flat block, which breaks fenced code,
# turns a hanging `-` into a setext heading, and splits inline code spans across
# lines. Off, the fragment's own layout is preserved and only indented.
wrap = false

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
